    <body aria-label="Website with striking monochrome background. The photograph shows a woman with a model's aesthetic striding past the Eiffel Tower.">
        <a href="#maincontent" class="skip-link">Skip to main content</a>
        <main id="maincontent">
            <!-- HERO SECTION !-->
            <section class="hero">
                <div class="hero__content">
                    <figure class="hero__branding">
                        <img src="../../assets/mistinguett/mistinguett-au-casino.jpeg" 
                             alt="Art Deco poster of Mistinguett, Parisian cabaret star, grinning in a swirl of dramatic white feathers"
                             class="hero__image">
                        <figcaption class="hero__caption">
                            <p class="text-block text-block--hero"> Salut, I'm Mistinguett, a Paris-based Marketer with 150 years experience</p>
                            <p class="text-block text-block--hero"> drawing people's eyes exactly where I want them</p>
                        </figcaption>
                    </figure>
                </div>
            </section>
            
            <!-- CTA EMAIL SECTION !-->
            <section class="cta-email">
                <div class="cta-email__content">
                    <p class="text-block text-block--cta"> Give me your email, and I'll give you the key to a worldwide reputation</p>
                    <form class="cta-email__form">
                        <label for="email" class="visually-hidden">Email Address</label>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               required 
                               placeholder="n'hésitez-pas@gmail.com"
                               class="cta-email__input">
                        <button type="submit" class="cta-email__button">Submit</button>
                    </form> 
                </div>
            </section>
        </main>
